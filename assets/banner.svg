<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Case file: Dania, CS student at NEDUET">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0141c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c0141c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c0141c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="900" height="300" rx="10"/></clipPath>

    <clipPath id="c1"><rect x="40" y="73" height="30" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" values="0;0;96;96;0;0" keyTimes="0;0.03;0.10;0.92;0.95;1"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="40" y="113" height="30" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" values="0;0;408;408;0;0" keyTimes="0;0.12;0.26;0.92;0.95;1"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="40" y="153" height="30" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" values="0;0;504;504;0;0" keyTimes="0;0.28;0.46;0.92;0.95;1"/>
    </rect></clipPath>
    <clipPath id="c4"><rect x="40" y="193" height="30" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" values="0;0;384;384;0;0" keyTimes="0;0.48;0.62;0.92;0.95;1"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="300" fill="#0b0b0b"/>
    <rect width="900" height="300" fill="url(#scan)"/>

    <rect x="0" y="-60" width="900" height="60" fill="url(#sweep)">
      <animate attributeName="y" from="-60" to="300" dur="6s" repeatCount="indefinite"/>
    </rect>

    <rect width="900" height="40" fill="#141414"/>
    <rect y="39" width="900" height="2" fill="#b3121d"/>
    <circle cx="24" cy="20" r="6" fill="#b3121d"/>
    <circle cx="46" cy="20" r="6" fill="#4a4a4a"/>
    <circle cx="68" cy="20" r="6" fill="#2b2b2b"/>
    <text x="450" y="25" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" fill="#8a8a8a" letter-spacing="2">misora@case-file:~ // FILE No. 337</text>

    <g font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold">
      <g clip-path="url(#c1)">
        <text x="40" y="95" fill="#b3121d" textLength="96" lengthAdjust="spacingAndGlyphs">$ whoami</text>
      </g>
      <g clip-path="url(#c2)">
        <text x="40" y="135" fill="#d9d9d9" textLength="408" lengthAdjust="spacingAndGlyphs">&gt; dania // cs student @ NEDUET '30</text>
      </g>
      <g clip-path="url(#c3)">
        <text x="40" y="175" fill="#8a8a8a" textLength="504" lengthAdjust="spacingAndGlyphs">&gt; hunting bugs. naming them. killing them.</text>
      </g>
      <g clip-path="url(#c4)">
        <text x="40" y="215" fill="#d9d9d9" textLength="384" lengthAdjust="spacingAndGlyphs">&gt; stack: C++ | SFML | C | Python</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.64;0.65;0.92;0.95;1"/>
        <text x="40" y="255" fill="#b3121d">&gt;</text>
        <rect x="66" y="238" width="12" height="20" fill="#b3121d">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.66;0.68;0.92;0.95;1"/>
      <g transform="rotate(-8 735 125)">
        <rect x="620" y="95" width="230" height="64" rx="4" fill="none" stroke="#b3121d" stroke-width="4"/>
        <rect x="628" y="103" width="214" height="48" rx="2" fill="none" stroke="#b3121d" stroke-width="1.5" opacity="0.6"/>
        <text x="735" y="139" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="bold" fill="#b3121d" letter-spacing="4">CLASSIFIED</text>
      </g>
      <text x="735" y="195" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" fill="#8a8a8a" letter-spacing="2">AGENT: D. KHAN</text>
      <text x="735" y="217" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" fill="#5a5a5a" letter-spacing="2">STATUS: ACTIVE</text>
    </g>

    <rect y="292" width="900" height="8" fill="#141414"/>
    <rect y="296" width="900" height="2" fill="#b3121d">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="none" stroke="#2a2a2a"/>
</svg>
